<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Shop — Al-Noor Central Library</title>
  <link rel="stylesheet" href="../css/global.css"/>
  <style>
    .page-wrapper { padding-top: var(--nav-h); background: var(--cream); min-height:100vh; }

    /* ── SHOP HERO ── */
    .shop-hero {
      background: var(--dark); padding: 3rem 5%;
      position: relative; overflow: hidden;
    }
    .shop-hero::before {
      content:''; position:absolute; inset:0;
      background: radial-gradient(ellipse 60% 80% at 80% 50%, rgba(201,149,42,0.09) 0%, transparent 70%);
    }
    .shop-hero-inner { max-width:1140px; margin:0 auto; position:relative; z-index:1;
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1.5rem; }
    .shop-hero h1 { font-family:var(--font-serif); font-size:clamp(1.8rem,3vw,2.4rem);
      color:var(--cream); margin-bottom:0.4rem; }
    .shop-hero p  { color:rgba(254,252,248,0.55); font-size:0.9rem; }
    .cart-bubble {
      display:flex; align-items:center; gap:12px;
      background:rgba(254,252,248,0.07); border:1px solid rgba(254,252,248,0.12);
      border-radius:var(--radius-lg); padding:0.85rem 1.25rem; cursor:pointer;
      transition:all 0.2s; text-decoration:none;
    }
    .cart-bubble:hover { background:rgba(254,252,248,0.12); }
    .cart-bubble .cart-icon { font-size:1.4rem; }
    .cart-info .cart-label { font-size:0.75rem; color:rgba(254,252,248,0.45); }
    .cart-info .cart-count { font-family:var(--font-serif); font-size:1.2rem; font-weight:700; color:var(--gold-light); }
    .cart-badge {
      background:var(--gold); color:var(--dark); border-radius:50%;
      width:22px; height:22px; display:flex; align-items:center; justify-content:center;
      font-size:0.72rem; font-weight:700; margin-left:4px;
    }

    /* ── LAYOUT ── */
    .shop-layout { display:flex; max-width:1140px; margin:0 auto; padding:0 5%; gap:0; }
    .filter-col {
      width:230px; flex-shrink:0;
      background:var(--card-bg); border-right:1px solid var(--border);
      padding:1.5rem 1.1rem; min-height:calc(100vh - var(--nav-h) - 160px);
      position:sticky; top:var(--nav-h);
    }
    .filter-col h3 { font-family:var(--font-serif); font-size:0.95rem; margin-bottom:1.25rem; }
    .filter-section { margin-bottom:1.5rem; }
    .filter-section-title { font-size:0.7rem; font-weight:700; text-transform:uppercase;
      letter-spacing:0.07em; color:var(--text-muted); margin-bottom:0.6rem; }
    .filter-option { display:flex; align-items:center; gap:8px; margin-bottom:0.45rem;
      font-size:0.84rem; color:var(--dark); cursor:pointer; }
    .filter-option input { accent-color:var(--brown); }
    .price-range { display:flex; gap:0.5rem; }
    .price-input { flex:1; padding:0.4rem 0.6rem; border:1.5px solid var(--border);
      border-radius:var(--radius-sm); font-size:0.82rem; background:var(--cream);
      outline:none; color:var(--dark); }
    .price-input:focus { border-color:var(--brown); }

    /* ── BOOKS AREA ── */
    .books-area { flex:1; padding:1.5rem 0 1.5rem 2rem; }
    .books-toolbar { display:flex; justify-content:space-between; align-items:center;
      margin-bottom:1.25rem; flex-wrap:wrap; gap:0.75rem; }
    .result-info { font-size:0.85rem; color:var(--text-muted); }
    .sort-bar { display:flex; align-items:center; gap:0.75rem; }
    .sort-sel { padding:0.4rem 0.75rem; border:1.5px solid var(--border); border-radius:var(--radius-sm);
      background:var(--card-bg); font-size:0.83rem; outline:none; cursor:pointer; }
    .view-toggle { display:flex; gap:4px; }
    .vt-btn { width:32px; height:32px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
      background:var(--card-bg); font-size:0.95rem; cursor:pointer; transition:all 0.2s; }
    .vt-btn.active { background:var(--brown); border-color:var(--brown); }

    /* ── GRID VIEW ── */
    .books-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:1.1rem; }
    .book-card {
      background:var(--card-bg); border:1px solid var(--border);
      border-radius:var(--radius-lg); overflow:hidden;
      transition:all 0.25s; display:flex; flex-direction:column;
    }
    .book-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
    .book-cover { height:180px; display:flex; align-items:center; justify-content:center;
      font-size:3rem; position:relative; }
    .bc1{background:linear-gradient(145deg,#8B4513,#C46A2A);}
    .bc2{background:linear-gradient(145deg,#2D5016,#4A8020);}
    .bc3{background:linear-gradient(145deg,#1A1A5E,#3333AA);}
    .bc4{background:linear-gradient(145deg,#5C1A1A,#8B2020);}
    .bc5{background:linear-gradient(145deg,#6B3FA0,#9B59B6);}
    .bc6{background:linear-gradient(145deg,#1A4A5C,#2E86A4);}
    .discount-chip {
      position:absolute; top:8px; left:8px;
      background:var(--crimson,#8B1A1A); color:white; font-size:0.68rem; font-weight:700;
      padding:2px 8px; border-radius:20px;
    }
    .book-body { padding:0.85rem; flex:1; }
    .book-body h4 { font-size:0.86rem; font-weight:600; margin-bottom:2px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .book-body .author { font-size:0.74rem; color:var(--text-muted); margin-bottom:0.6rem; }
    .price-row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
    .price-now { font-family:var(--font-serif); font-size:1.05rem; font-weight:700; color:var(--brown); }
    .price-was { font-size:0.75rem; color:var(--text-muted); text-decoration:line-through; }
    .book-footer { padding:0.7rem 0.85rem; border-top:1px solid var(--border);
      display:flex; gap:0.4rem; }
    .btn-buy { flex:1; padding:0.5rem; background:var(--brown); color:var(--cream);
      border:none; border-radius:var(--radius-sm); font-size:0.78rem; font-weight:600;
      cursor:pointer; transition:all 0.2s; }
    .btn-buy:hover { background:var(--dark); }
    .btn-cart { width:36px; height:36px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
      background:var(--card-bg); cursor:pointer; font-size:1rem; transition:all 0.2s; flex-shrink:0; }
    .btn-cart:hover { border-color:var(--brown); background:rgba(92,61,30,0.07); }
    .stock-low { font-size:0.7rem; color:#C0392B; font-weight:500; margin-top:4px; }

    /* ── LIST VIEW ── */
    .books-list { display:none; flex-direction:column; gap:0.75rem; }
    .list-card {
      background:var(--card-bg); border:1px solid var(--border);
      border-radius:var(--radius-md); padding:1rem 1.25rem;
      display:flex; align-items:center; gap:1.25rem; transition:all 0.2s;
    }
    .list-card:hover { border-color:var(--brown); box-shadow:var(--shadow-sm); }
    .list-spine { width:56px; height:70px; border-radius:6px; display:flex;
      align-items:center; justify-content:center; font-size:1.8rem; flex-shrink:0; }
    .list-meta { flex:1; min-width:0; }
    .list-meta h4 { font-size:0.92rem; font-weight:600; margin-bottom:2px; }
    .list-meta .sub { font-size:0.78rem; color:var(--text-muted); }
    .list-price { text-align:right; flex-shrink:0; }
    .list-actions { display:flex; gap:0.5rem; flex-shrink:0; }

    /* ── TOAST ── */
    #toast-area { position:fixed; bottom:2rem; right:2rem; z-index:9999;
      display:flex; flex-direction:column; gap:0.5rem; }
    .toast { background:var(--dark); color:var(--cream); padding:0.85rem 1.25rem;
      border-radius:var(--radius-md); font-size:0.85rem; box-shadow:var(--shadow-lg);
      display:flex; align-items:center; gap:10px; min-width:240px;
      animation:slideIn 0.3s ease; }
    .toast.success { border-left:3px solid var(--green-light,#4A7C2F); }
    .toast.error   { border-left:3px solid #C0392B; }
    @keyframes slideIn { from{transform:translateX(110%);opacity:0;} to{transform:translateX(0);opacity:1;} }

    /* ── QUICK VIEW MODAL ── */
    .modal-bg { position:fixed; inset:0; z-index:500; background:rgba(26,20,16,0.55);
      backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity 0.25s; }
    .modal-bg.open { opacity:1; pointer-events:all; }
    .modal-box { background:var(--white,#FEFCF8); border-radius:var(--radius-xl);
      padding:0; width:90%; max-width:680px; overflow:hidden;
      transform:scale(0.95); transition:transform 0.25s; }
    .modal-bg.open .modal-box { transform:scale(1); }
    .qv-grid { display:grid; grid-template-columns:240px 1fr; }
    .qv-cover { height:340px; display:flex; align-items:center; justify-content:center; font-size:5rem; }
    .qv-info { padding:2rem; display:flex; flex-direction:column; }
    .qv-close { position:absolute; top:1rem; right:1rem; background:rgba(26,20,16,0.5); color:white;
      border:none; border-radius:50%; width:30px; height:30px; cursor:pointer; font-size:1rem;
      display:flex; align-items:center; justify-content:center; }
    .qv-title { font-family:var(--font-serif); font-size:1.3rem; font-weight:700; margin-bottom:0.25rem; }
    .qv-author { font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem; }
    .qv-price-big { font-family:var(--font-serif); font-size:1.8rem; font-weight:700; color:var(--brown); }
    .qv-was { font-size:0.85rem; color:var(--text-muted); text-decoration:line-through; }
    .qv-desc { font-size:0.85rem; color:var(--text-muted); line-height:1.65; margin:1rem 0; flex:1; }
    .qty-picker { display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem; }
    .qty-btn { width:34px; height:34px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
      background:var(--cream); font-size:1.1rem; cursor:pointer; transition:all 0.2s; }
    .qty-btn:hover { border-color:var(--brown); }
    .qty-num { font-family:var(--font-serif); font-size:1.1rem; font-weight:700; min-width:30px; text-align:center; }
    .qv-actions { display:flex; gap:0.75rem; }
    .btn-qv-buy { flex:1; padding:0.82rem; background:var(--brown); color:var(--cream);
      border:none; border-radius:var(--radius-md); font-weight:600; font-size:0.92rem; cursor:pointer; transition:all 0.2s; }
    .btn-qv-buy:hover { background:var(--dark); }
    .btn-qv-cart { padding:0.82rem 1rem; border:1.5px solid var(--border); border-radius:var(--radius-md);
      background:var(--card-bg); font-size:1rem; cursor:pointer; transition:all 0.2s; }
    .btn-qv-cart:hover { border-color:var(--brown); }

    @media(max-width:900px){
      .shop-layout { flex-direction:column; }
      .filter-col { width:100%; position:static; }
      .books-area { padding:1.25rem 0; }
      .qv-grid { grid-template-columns:1fr; }
      .qv-cover { height:200px; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="#F0D080"><path d="M4 4h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg></div>
    LibraSmart
  </a>
  <nav class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="catalog.html">Borrow</a>
    <a href="shop.html" class="active">Buy Books</a>
    <a href="my-orders.html">My Orders</a>
  </nav>
  <div class="nav-actions">
    <a href="cart.html" class="btn btn-outline btn-sm">🛒 Cart <span id="navCartCount" style="background:var(--gold);color:var(--dark);padding:1px 7px;border-radius:20px;font-size:0.7rem;font-weight:700;margin-left:4px;">0</span></a>
    <div class="nav-user"><div class="nav-avatar">AK</div></div>
  </div>
</nav>

<div class="page-wrapper">

  <!-- SHOP HERO -->
  <div class="shop-hero">
    <div class="shop-hero-inner">
      <div>
        <h1>📚 Buy Books Online</h1>
        <p>Purchase books and get them delivered to your doorstep across Pakistan</p>
      </div>
      <a href="cart.html" class="cart-bubble">
        <span class="cart-icon">🛒</span>
        <div class="cart-info">
          <div class="cart-label">Your Cart</div>
          <div class="cart-count"><span id="heroCartCount">0</span> items</div>
        </div>
        <div class="cart-badge" id="heroBadge">0</div>
      </a>
    </div>
  </div>

  <div class="shop-layout">

    <!-- FILTERS -->
    <aside class="filter-col">
      <h3>🔍 Filter Books</h3>

      <div class="filter-section">
        <div class="filter-section-title">Availability</div>
        <label class="filter-option"><input type="checkbox" checked onchange="applyFilters()"/> In Stock Only</label>
        <label class="filter-option"><input type="checkbox" onchange="applyFilters()"/> On Sale / Discounted</label>
      </div>

      <div class="filter-section">
        <div class="filter-section-title">Genre</div>
        <label class="filter-option"><input type="checkbox" onchange="applyFilters()"/> Technology</label>
        <label class="filter-option"><input type="checkbox" onchange="applyFilters()"/> History</label>
        <label class="filter-option"><input type="checkbox" onchange="applyFilters()"/> Science Fiction</label>
        <label class="filter-option"><input type="checkbox" onchange="applyFilters()"/> Self-Help</label>
        <label class="filter-option"><input type="checkbox" onchange="applyFilters()"/> Business</label>
        <label class="filter-option"><input type="checkbox" onchange="applyFilters()"/> Literature</label>
      </div>

      <div class="filter-section">
        <div class="filter-section-title">Price Range (PKR)</div>
        <div class="price-range">
          <input type="number" class="price-input" placeholder="Min" id="priceMin" min="0"/>
          <input type="number" class="price-input" placeholder="Max" id="priceMax" min="0"/>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-section-title">Language</div>
        <label class="filter-option"><input type="checkbox" checked/> English</label>
        <label class="filter-option"><input type="checkbox"/> Urdu</label>
      </div>

      <button class="btn btn-primary btn-full btn-sm" style="margin-top:0.5rem;" onclick="applyFilters()">Apply Filters</button>
      <button class="btn btn-ghost btn-full btn-sm" style="margin-top:0.4rem;" onclick="clearFilters()">Clear All</button>
    </aside>

    <!-- BOOKS AREA -->
    <div class="books-area">
      <div class="books-toolbar">
        <div class="result-info">Showing <strong id="bookCount">8</strong> books for sale</div>
        <div class="sort-bar">
          <select class="sort-sel" onchange="sortBooks(this.value)">
            <option value="popular">Most Popular</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="az">A–Z</option>
            <option value="new">Newest First</option>
          </select>
          <div class="view-toggle">
            <button class="vt-btn active" title="Grid" onclick="setView('grid',this)">⊞</button>
            <button class="vt-btn" title="List" onclick="setView('list',this)">☰</button>
          </div>
        </div>
      </div>

      <!-- GRID VIEW -->
      <div class="books-grid" id="booksGrid">
        <!-- Cards generated by JS / PHP -->
      </div>

      <!-- LIST VIEW -->
      <div class="books-list" id="booksList"></div>

      <div class="pagination" id="pagination" style="margin-top:2rem;"></div>
    </div>
  </div>
</div>

<!-- QUICK VIEW MODAL -->
<div class="modal-bg" id="qvModal">
  <div class="modal-box" style="position:relative;">
    <button class="qv-close" onclick="closeQV()">✕</button>
    <div class="qv-grid">
      <div class="qv-cover" id="qvCover"></div>
      <div class="qv-info">
        <div class="qv-title" id="qvTitle"></div>
        <div class="qv-author" id="qvAuthor"></div>
        <div>
          <span class="qv-price-big" id="qvPrice"></span>
          <span class="qv-was" id="qvWas"></span>
        </div>
        <div class="qv-desc" id="qvDesc"></div>
        <div class="qty-picker">
          <span style="font-size:0.82rem;color:var(--text-muted);margin-right:4px;">Qty:</span>
          <button class="qty-btn" onclick="changeQty(-1)">−</button>
          <div class="qty-num" id="qtyNum">1</div>
          <button class="qty-btn" onclick="changeQty(1)">+</button>
          <span style="font-size:0.75rem;color:var(--text-muted);" id="qvStock"></span>
        </div>
        <div class="qv-actions">
          <button class="btn-qv-buy" onclick="buyNow()">⚡ Buy Now</button>
          <button class="btn-qv-cart" onclick="addToCartQV()">🛒 Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast-area"></div>

<script>
// Demo books data (replaced by PHP fetch in production)
const BOOKS = [
  {id:1,title:"Clean Code",author:"Robert C. Martin",genre:"Technology",price:699,was:850,stock:25,emoji:"📘",color:"bc1",desc:"A revolutionary paradigm for writing clean, maintainable software code."},
  {id:2,title:"Sapiens",author:"Yuval Noah Harari",genre:"History",price:750,was:null,stock:30,emoji:"🌿",color:"bc2",desc:"A brief history of humankind — from the Stone Age to the present."},
  {id:3,title:"Dune",author:"Frank Herbert",genre:"Sci-Fi",price:799,was:920,stock:18,emoji:"🌌",color:"bc3",desc:"The greatest science fiction novel ever written. A masterpiece of imagination."},
  {id:4,title:"Atomic Habits",author:"James Clear",genre:"Self-Help",price:599,was:680,stock:40,emoji:"🔥",color:"bc4",desc:"Tiny changes, remarkable results. The definitive guide to building good habits."},
  {id:5,title:"Thinking, Fast and Slow",author:"Daniel Kahneman",genre:"Psychology",price:790,was:null,stock:22,emoji:"🔮",color:"bc5",desc:"A masterpiece about the two systems that drive the way we think."},
  {id:6,title:"The Lean Startup",author:"Eric Ries",genre:"Business",price:680,was:null,stock:15,emoji:"🌊",color:"bc6",desc:"How today's entrepreneurs use continuous innovation to create successful businesses."},
  {id:7,title:"Rich Dad Poor Dad",author:"Robert Kiyosaki",genre:"Finance",price:520,was:null,stock:8,emoji:"💰",color:"bc1",desc:"What the rich teach their kids about money that the poor and middle class do not."},
  {id:8,title:"Deep Work",author:"Cal Newport",genre:"Self-Help",price:650,was:null,stock:33,emoji:"🌱",color:"bc2",desc:"Rules for focused success in a distracted world."},
];

let currentBook = null, qty = 1;

function renderBooks(books) {
  const grid = document.getElementById('booksGrid');
  const list = document.getElementById('booksList');
  document.getElementById('bookCount').textContent = books.length;

  grid.innerHTML = books.map(b => `
    <div class="book-card">
      <div class="book-cover ${b.color}" style="cursor:pointer;" onclick="openQV(${b.id})">
        ${b.emoji}
        ${b.was ? `<div class="discount-chip">${Math.round((1-b.price/b.was)*100)}% OFF</div>` : ''}
      </div>
      <div class="book-body">
        <h4>${b.title}</h4>
        <div class="author">${b.author}</div>
        <div class="price-row">
          <span class="price-now">PKR ${b.price.toLocaleString()}</span>
          ${b.was ? `<span class="price-was">PKR ${b.was.toLocaleString()}</span>` : ''}
        </div>
        ${b.stock <= 5 ? `<div class="stock-low">⚠ Only ${b.stock} left!</div>` : ''}
      </div>
      <div class="book-footer">
        <button class="btn-buy" onclick="addToCart(${b.id})">🛒 Add to Cart</button>
        <button class="btn-cart" title="Quick View" onclick="openQV(${b.id})">👁</button>
      </div>
    </div>`).join('');

  list.innerHTML = books.map(b => `
    <div class="list-card">
      <div class="list-spine ${b.color}">${b.emoji}</div>
      <div class="list-meta">
        <h4>${b.title}</h4>
        <div class="sub">${b.author} · ${b.genre}</div>
        ${b.stock <= 5 ? `<div class="stock-low">⚠ Only ${b.stock} left!</div>` : ''}
      </div>
      <div class="list-price">
        <div class="price-now">PKR ${b.price.toLocaleString()}</div>
        ${b.was ? `<div class="price-was">PKR ${b.was.toLocaleString()}</div>` : ''}
      </div>
      <div class="list-actions">
        <button class="btn btn-primary btn-sm" onclick="addToCart(${b.id})">Add to Cart</button>
        <button class="btn btn-ghost btn-sm" onclick="openQV(${b.id})">View</button>
      </div>
    </div>`).join('');
}

// ── CART ──────────────────────────────────
let cartCount = 0;
function addToCart(bookId, quantity=1) {
  cartCount++;
  updateCartBadge();
  toast('✅ Added to cart!', 'success');
  /* In production:
  fetch('backend/cart.php', {
    method:'POST',
    body: new URLSearchParams({action:'add', book_id:bookId, quantity:quantity})
  }).then(r=>r.json()).then(data=>{
    if(data.success){ updateCartBadge(data.cart_count); toast(data.message,'success'); }
    else toast(data.message,'error');
  }); */
}
function updateCartBadge(n) {
  if(n!==undefined) cartCount=n;
  document.getElementById('navCartCount').textContent = cartCount;
  document.getElementById('heroCartCount').textContent = cartCount;
  document.getElementById('heroBadge').textContent = cartCount;
}

// ── QUICK VIEW ────────────────────────────
function openQV(id) {
  currentBook = BOOKS.find(b=>b.id===id);
  if(!currentBook) return;
  qty = 1;
  document.getElementById('qvTitle').textContent  = currentBook.title;
  document.getElementById('qvAuthor').textContent = currentBook.author;
  document.getElementById('qvPrice').textContent  = `PKR ${currentBook.price.toLocaleString()}`;
  document.getElementById('qvWas').textContent    = currentBook.was ? `PKR ${currentBook.was.toLocaleString()}` : '';
  document.getElementById('qvDesc').textContent   = currentBook.desc;
  document.getElementById('qvStock').textContent  = `${currentBook.stock} in stock`;
  document.getElementById('qvCover').className    = `qv-cover ${currentBook.color}`;
  document.getElementById('qvCover').style.fontSize = '5rem';
  document.getElementById('qvCover').textContent  = currentBook.emoji;
  document.getElementById('qtyNum').textContent   = 1;
  document.getElementById('qvModal').classList.add('open');
}
function closeQV() { document.getElementById('qvModal').classList.remove('open'); }
function changeQty(d) {
  qty = Math.max(1, Math.min(qty+d, currentBook?.stock||10));
  document.getElementById('qtyNum').textContent = qty;
}
function addToCartQV()  { if(currentBook){ addToCart(currentBook.id, qty); closeQV(); } }
function buyNow()       { if(currentBook){ addToCart(currentBook.id, qty); closeQV(); window.location.href='cart.html'; } }

// ── SORT & FILTER ─────────────────────────
function sortBooks(by) {
  const b = [...BOOKS];
  if(by==='price_asc')  b.sort((a,c)=>a.price-c.price);
  if(by==='price_desc') b.sort((a,c)=>c.price-a.price);
  if(by==='az')         b.sort((a,c)=>a.title.localeCompare(c.title));
  renderBooks(b);
}
function applyFilters() { renderBooks(BOOKS); }
function clearFilters() { renderBooks(BOOKS); }

// ── VIEW TOGGLE ───────────────────────────
function setView(v, btn) {
  document.getElementById('booksGrid').style.display = v==='grid'?'grid':'none';
  document.getElementById('booksList').style.display = v==='list'?'flex':'none';
  document.querySelectorAll('.vt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ── TOAST ────────────────────────────────
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast-area').appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}

// ── CLOSE MODAL ON BG CLICK ───────────────
document.getElementById('qvModal').addEventListener('click',function(e){if(e.target===this)closeQV();});

// ── INIT ──────────────────────────────────
renderBooks(BOOKS);
